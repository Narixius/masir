name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: darwin-arm64, runner: macos-15 }
          - { target: darwin-x64, runner: macos-15-intel }
          - { target: linux-x64-gnu, runner: ubuntu-24.04 }
          - { target: linux-arm64-gnu, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable

      - name: Build masir
        run: |
          # scriptc comes from node_modules (a devDependency). pnpm-lock.yaml is not committed, so resolve fresh.
          pnpm install --no-frozen-lockfile
          PROFILE=release scripts/build-native.sh
          scripts/build.sh

      - name: Smoke test
        run: |
          ./dist/masir --version
          ./dist/masir rules list --json

      - name: Package
        run: tar -czf "masir-${{ matrix.target }}.tar.gz" -C dist masir

      - uses: actions/upload-artifact@v4
        with:
          name: masir-${{ matrix.target }}
          path: masir-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/masir-*.tar.gz
          generate_release_notes: true
