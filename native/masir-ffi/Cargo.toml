[package]
name = "masir-ffi"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["staticlib", "rlib"]

[dependencies]
ar-reshaper = "1.5.0"
celes = "3"
crossterm = "0.29"
masir-transport = { path = "../masir-transport" }
masir-xray-grpc = { path = "../masir-xray-grpc" }
prost = "0.13.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.39.6", default-features = false, features = ["system"] }
unicode-bidi = "0.3.18"
